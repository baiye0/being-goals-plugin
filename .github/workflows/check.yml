name: Check plugin
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: tar -czf desktop-plugin.tar.gz -C dist desktop.plugin.json index.html
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-plugin
          path: desktop-plugin.tar.gz
